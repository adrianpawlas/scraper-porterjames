name: Scrape Porter James

on:
  # Scheduled: every Tuesday at 20:00 UTC
  # (If you're in CET/CEST, that's 21:00-22:00 local time)
  schedule:
    - cron: "0 20 * * 2"

  # Manual trigger from GitHub UI (allows running on demand)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    # Prevent multiple concurrent runs
    concurrency:
      group: porter-james-scraper
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-siglip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            huggingface-siglip-${{ runner.os }}-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        id: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python main.py 2>&1 | tee scraper_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Upload scraper output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-run-log
          path: scraper_output.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Porter James scraper failed! Check the run logs for details."
